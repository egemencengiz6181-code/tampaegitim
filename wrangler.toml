# Cloudflare Workers (static assets) yapılandırması: `npx wrangler deploy`.
# Sayfa kuralları public/_redirects ve public/_headers içinde; /api/* istekleri worker/index.js üzerinden
# functions/ altındaki işleyicilere gider. Sır değerleri (ADMIN_PASSWORD, GITHUB_TOKEN vb.) panelden tanımlanır.
name = "tampaegitim"
main = "worker/index.js"
compatibility_date = "2025-11-21"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]
