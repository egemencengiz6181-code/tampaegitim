# Cloudflare Workers (static assets) yapılandırması: `npx wrangler deploy`.
# /api/* istekleri functions/ altındaki işleyicilere gider; 301 yönlendirmeleri, /admin proxy'si ve özel
# başlıklar worker/index.js içinde uygulanır (Workers statik varlıkları _redirects/_headers işlemez;
# bu dosyalar Pages dağıtımı içindir). Sır değerleri (ADMIN_PASSWORD, GITHUB_TOKEN vb.) panelden tanımlanır.
name = "tampaegitim"
main = "worker/index.js"
compatibility_date = "2025-11-21"
# Panelden girilen değişkenler (LEAD_WEBHOOK_URL vb.) her `wrangler deploy` ile silinmesin
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Tüm istekler worker'dan geçer: 301'ler ve başlıklar ancak böyle uygulanır
run_worker_first = true
